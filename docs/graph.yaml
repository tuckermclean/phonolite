template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: PHONOLITE_REQUIRE_MPG123=1 PHONOLITE_REQUIRE_XVFB=1 cargo test --workspace
  fail_pattern: '^test .+ \.\.\. FAILED$'
  known_red: []
out_of_scope:
  - {glob: "Cargo.lock", reason: "generated by cargo, never edited by hand"}
  - {glob: "third_party/", reason: "the upstream minimp3 licence and notice, kept verbatim"}
adoption:
  areas:
    - {name: decoder, globs: ["mpeg/", "src/builtin.rs", "tests/data/mpeg/"]}
    - name: audio
      globs: ["src/audio.rs", "src/engine.rs", "src/remote.rs", "src/player.rs", "src/eq.rs", "src/oss.rs",
              "src/pulse.rs", "examples/"]
    - name: formats
      globs: ["src/inflate.rs", "src/zip.rs", "src/playlist.rs", "src/config.rs", "src/num.rs",
              "tests/data/*.deflate", "tests/data/skin.zip"]
    - {name: skin, globs: ["src/skin/", "src/vis.rs"]}
    - {name: app, globs: ["src/app/", "src/main.rs", "src/lib.rs", "tests/xvfb.rs"]}
    - {name: build, globs: ["tools/", "targets/", ".github/", "Cargo.toml", "rustfmt.toml", ".gitignore"]}
    - {name: docs, globs: ["README.md", "CHANGELOG.md", "CLAUDE.md", "LICENSE-*"]}
nodes: []
